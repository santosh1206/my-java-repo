<form id="leadForm">
  <!-- Hidden Subject for FormSubmit -->
  <input type="hidden" id="formSubject" value="New Azure Training / Consulting Inquiry - Santosh Sahoo" />

  <div class="form-group">
    <label for="name">Full Name *</label>
    <input type="text" id="name" name="name" placeholder="John Doe" required />
  </div>

  <div class="form-group">
    <label for="email">Email Address *</label>
    <input type="email" id="email" name="email" placeholder="john@example.com" required />
  </div>

  <div class="form-group">
    <label for="phone">Phone / WhatsApp</label>
    <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" />
  </div>

  <div class="form-group">
    <label for="focus">Primary Focus Area</label>
    <select id="focus" name="focus">
      <option value="complete-track">Full Track: Azure Platform + Terraform + CI/CD</option>
      <option value="terraform-iac">Terraform & Enterprise IaC</option>
      <option value="cicd-devops">Azure DevOps & GitHub Pipelines</option>
      <option value="corporate-consulting">Corporate Training / Consulting</option>
    </select>
  </div>

  <div class="form-group">
    <label for="experience">Current Role & Objective</label>
    <textarea id="experience" name="experience" rows="3" placeholder="Current experience, tools used, and target learning goals..."></textarea>
  </div>

  <button type="submit" id="submitBtn">Submit Registration</button>
  <div id="formStatus" style="margin-top: 12px; font-size: 0.9rem; display: none;"></div>
</form>

<script>
  const leadForm = document.getElementById('leadForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusDiv = document.getElementById('formStatus');

  leadForm.addEventListener('submit', async function (e) {
    e.preventDefault();

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';
    statusDiv.style.display = 'none';

    const payload = {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
      focus: document.getElementById('focus').value,
      experience: document.getElementById('experience').value,
      _subject: document.getElementById('formSubject').value,
      _captcha: 'false',
      _template: 'table'
    };

    try {
      const response = await fetch('https://formsubmit.co/ajax/nitsantosh@yahoo.com', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (response.ok && result.success === "true") {
        statusDiv.style.color = '#15803d';
        statusDiv.textContent = 'Thank you! Your registration has been received. I will reach out shortly.';
        statusDiv.style.display = 'block';
        leadForm.reset();
      } else {
        throw new Error(result.message || 'Submission failed');
      }
    } catch (error) {
      statusDiv.style.color = '#b91c1c';
      statusDiv.textContent = 'Something went wrong. Please check your network or try again.';
      statusDiv.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Registration';
    }
  });
</script>
